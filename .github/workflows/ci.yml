name: Python CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q patchscope scripts
      - run: python -m pytest -q tests/
      - run: python -m scripts.run_experiment --manifest experiments/smoke_v02.json --dry-run
      - run: python -m scripts.run_experiment --manifest experiments/pilot_v02.json --dry-run
      - run: python -m scripts.run_experiment --manifest experiments/interference_smoke_v030.json --dry-run
      - run: python -m scripts.run_experiment --manifest experiments/benchmark-decoy-v040.json --dry-run

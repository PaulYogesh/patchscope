name: PatchScope offline verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the benchmark adapter and offline demo
        run: |
          python -m unittest discover -s tests -p 'test_swebench_dev*.py' -v
          python -m unittest discover -s tests -p 'test_offline_demo.py' -v
      - name: Render the demo report
        shell: bash
        run: |
          demo_root="$(mktemp -d)/patchscope-demo"
          python -m scripts.demo_paired_repair --output "$demo_root" | tee -a "$GITHUB_STEP_SUMMARY"
